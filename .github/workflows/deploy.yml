name: Build site

# The site is self-hosted. This workflow only builds it: withastro/action uploads the build as the
# `github-pages` artifact, and the web server pulls that artifact from the newest successful run of this file
# on main within a few minutes. Keep the file name, the artifact name and a successful conclusion; the server
# matches on all three. The build must contain index.html and 404.html.

on:
  push:
    branches: [main]
  # Run by hand from the Actions tab, and by FrightWorks-no100f's release-dispatch.yml when a release is
  # published, so the version and download links update within minutes.
  workflow_dispatch:
  # For a game repo that sends a repository_dispatch instead.
  repository_dispatch:
    types: [release-published]
  # Rebuild every 3 hours: the fallback for the version label and download links. New download stats are
  # picked up sooner by stats-check.yml, which starts this workflow when stats.json changes.
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24
        env:
          # Read-only use: the build fetches each game's latest release from the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
