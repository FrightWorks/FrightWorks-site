name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Run by hand from the Actions tab.
  workflow_dispatch:
  # Sent by a game repo's release workflow so the version and download links update.
  repository_dispatch:
    types: [release-published]
  # Fallback in case a dispatch is missed: rebuild once a day.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24
        env:
          # Read-only use: the build fetches each game's latest release from the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
